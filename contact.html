<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Now | SnapCabin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main>
      <section class="section-title" style="padding-top: 120px;">
        <div class="container">
          <h2>Book Your Experience</h2>
          <p>Tell us about your event and we'll get back to you shortly.</p>
          <div class="underline"></div>
        </div>
      </section>

      <section id="contact">
        <div class="container">
          <form class="contact-form" id="booking-form">
            <div class="form-group">
              <label for="name">Full Name</label>
              <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
              <div class="form-group">
                <label for="date">Event Date</label>
                <input type="date" id="date" name="date" required>
              </div>
              <div class="form-group">
                <label for="event-type">Event Type</label>
                <select id="event-type" name="event-type" required>
                  <option value="">Select an option</option>
                  <option value="wedding">Wedding</option>
                  <option value="corporate">Corporate Event</option>
                  <option value="birthday">Birthday Party</option>
                  <option value="quinceanera">Quinceañera</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label for="package">Preferred Package</label>
              <select id="package" name="package">
                <option value="not-sure">Not sure yet</option>
                <option value="selfie">Selfie Photobooth ($400)</option>
                <option value="360spin">360 Spin Photobooth ($145/hr)</option>
                <option value="mirror">Mirror Booth ($175/hr)</option>
                <option value="audio-guestbook">Audio Guest Book ($400)</option>
                <option value="bundle">The Ultimate Bundle (Selfie + Audio - $650)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="message">Tell us more (Venue, headcount, etc.)</label>
              <textarea id="message" name="message" rows="5" placeholder="Let us know any specific details..."></textarea>
            </div>
            <button type="submit" class="btn-submit">Submit Inquiry</button>
            <div id="form-message" style="margin-top: 20px; display: none; text-align: center; color: green; font-weight: 600;">
              Thank you! Your inquiry has been sent. We'll be in touch soon.
            </div>
          </form>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // Simple form submission simulation
      document.getElementById('booking-form').addEventListener('submit', (e) => {
        e.preventDefault();
        document.getElementById('form-message').style.display = 'block';
        e.target.reset();
      });
    </script>
  </body>
</html>
