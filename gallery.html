<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | SnapCabin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/assets/main-D5W3H3dU.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/main-d-KqvzjE.css">
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main>
      <section class="section-title" style="padding-top: 120px;">
        <div class="container">
          <h2>Our Photo Gallery</h2>
          <p>Weddings, quinceañeras, birthdays & beyond — real smiles in every shot.</p>
          <div class="underline"></div>
        </div>
      </section>

      <section id="gallery">
        <div class="container">
          <div class="gallery-grid">
            <div class="gallery-item">
              <img src="/images/gallery-1.png" alt="Happy friends in photobooth">
            </div>
            <div class="gallery-item">
              <img src="/images/gallery-2.png" alt="Wedding couple posing">
            </div>
            <div class="gallery-item">
              <img src="/images/gallery-3.png" alt="Corporate holiday party">
            </div>
            <div class="gallery-item">
              <img src="/images/gallery-4.png" alt="Family fun photobooth">
            </div>
            <div class="gallery-item">
              <img src="/images/product-selfie.png" alt="Selfie Booth Kiosk">
            </div>
            <div class="gallery-item">
              <img src="/images/product-360spin.png" alt="360 Spin Booth setup">
            </div>
            <div class="gallery-item">
              <img src="/images/product-mirror.png" alt="Mirror Booth in action">
            </div>
            <div class="gallery-item">
              <img src="/images/product-audio-guestbook.png" alt="Audio Guestbook telephone">
            </div>
          </div>
        </div>
      </section>

      <section style="background-color: var(--secondary-color); color: white; text-align: center;">
        <div class="container">
          <h2>Ready to make your event unforgettable?</h2>
          <p style="margin: 20px 0 30px;">Book SnapCabin for your next party!</p>
          <a href="/contact.html" class="btn-book">Get a Quote</a>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </body>
</html>
